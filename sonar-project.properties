# Configuración de SonarQube para el proyecto Frezzyks Bot

# Identificador único del proyecto
sonar.projectKey=frezzyks-bot
sonar.projectName=Frezzyks Email Classification Bot
sonar.projectVersion=1.2.0

# Ruta del código fuente (excluye tests — declarados en sonar.tests)
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Declaración semántica de archivos de test
# Esto le dice a Sonar que estos son tests, no código de producción.
# Junto con sonar.cpd.exclusions abajo, elimina la duplicación falsa.
sonar.tests=tests/
sonar.test.inclusions=tests/**,test-correcciones.js,test-adjuntos.js

# Exclusiones
# Los archivos de test NO deben contar para duplicación de código
# pero SÍ deben ser analizados (para encontrar bugs en los tests)
sonar.exclusions=node_modules/**,\
    .git/**,\
    .env,\
    .env.example,\
    *.log,\
    *.md

# Regla CRÍTICA: Excluir test files del análisis de DUPLICACIÓN
# Esto permite que test-correcciones.js, tests/** existan sin penalizar duplicación
sonar.cpd.exclusions=test-*.js,\
    tests/**,\
    **/*.test.js,\
    **/*.spec.js

# Ignora estos archivos completamente (no aparecen en el análisis)
sonar.coverage.exclusions=test-*.js,\
    tests/**,\
    **/*.test.js,\
    **/*.spec.js,\
    verify-env.js,\
    obtener-token-shopify.js,\
    verify-token.js

# Lenguaje principal
sonar.language=js
